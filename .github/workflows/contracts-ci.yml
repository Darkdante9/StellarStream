name: Contracts CI

on:
  push:
    branches: [ main, StellarStream-HQ ]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    branches: [ main, StellarStream-HQ ]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-check:
    name: Check ${{ matrix.contract }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        contract: [Contract-V1, Contract-V2, splitter-factory, splitter-v3]
      fail-fast: false
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: contracts/${{ matrix.contract }}

      - name: Format Check
        run: cargo fmt --all -- --check
        working-directory: contracts/${{ matrix.contract }}

      - name: Clippy Linting
        run: cargo clippy -- -D warnings
        working-directory: contracts/${{ matrix.contract }}

      - name: Cargo Build
        run: cargo build --release
        working-directory: contracts/${{ matrix.contract }}

      - name: Cargo Test
        run: cargo test
        working-directory: contracts/${{ matrix.contract }}

      - name: Install cargo-audit
        run: cargo install cargo-audit || true

      - name: Cargo Audit
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi
          cargo audit
        working-directory: contracts/${{ matrix.contract }}
        continue-on-error: true # Security advisory audits might trigger failures, we log but continue

      - name: Cargo Bench
        run: cargo test bench_ --release || cargo bench
        working-directory: contracts/${{ matrix.contract }}

  # ── Issue #1387: Formal Verification ──────────────────────────────────────
  #
  # Runs property-based formal verification tests for contracts that define
  # formal specs (Contract-V2, splitter-v3, escrow). Each contract's
  # formal_spec.rs + verify.rs module exercises 10k–20k random property
  # iterations covering:
  #
  #   Payment logic       — PAY-* / SPY-* / EPY-*
  #   Balance arithmetic  — BAL-* / SBC-* / EBL-*
  #   State transitions   — STA-* / SST-* / EST-*
  #   Access control      — ACC-* / SAC-* / EAC-*
  #   Emergency / pause   — EMG-* / SEM-* / EEM-*
  #
  # This job runs AFTER contracts-check to ensure the contracts compile and
  # pass all existing tests before running verification.
  formal-verification:
    name: Formal Verification — ${{ matrix.contract }}
    runs-on: ubuntu-latest
    needs: contracts-check
    strategy:
      matrix:
        contract: [Contract-V2, splitter-v3, escrow]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: contracts/${{ matrix.contract }}

      - name: Build (with formal-verification feature)
        run: cargo build --features formal-verification
        working-directory: contracts/${{ matrix.contract }}

      - name: Run Formal Verification Tests
        # Run the formal_verification test module with full output so any
        # violated spec and its iteration details are visible in CI logs.
        run: |
          cargo test formal_verification -- --nocapture 2>&1 | tee /tmp/fv-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if grep -qiE "VIOLATION|panicked at|test .* FAILED" /tmp/fv-output.txt; then
            echo "❌ Formal verification violations detected — see output above"
            exit 1
          fi
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Formal verification tests exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "✅ All formal verification specs passed for ${{ matrix.contract }}"
        working-directory: contracts/${{ matrix.contract }}

      - name: Upload Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-report-${{ matrix.contract }}
          path: /tmp/fv-output.txt
          retention-days: 30

      - name: Write Step Summary
        if: always()
        run: |
          echo "## Formal Verification — ${{ matrix.contract }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/fv-output.txt ] && ! grep -qiE "VIOLATION|panicked at|test .* FAILED" /tmp/fv-output.txt; then
            echo "**Status:** ✅ All specs passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Violations detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Coverage Report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^=== |^  [A-Z]{3}-[0-9]" /tmp/fv-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
